name: calendarapp

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: api
    environment:
      MONGODB_URL: ${MONGODB_URL:?MONGODB_URL must be set}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-calendarapp}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-10080}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://calendar.rabidflamingos.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      PASSWORD_RESET_EXPIRE_MINUTES: ${PASSWORD_RESET_EXPIRE_MINUTES:-60}
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8005"
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - calendarapp

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
      target: frontend-react
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      calendarapp:
      piservices-proxy:
        aliases:
          - calendarapp-frontend

networks:
  calendarapp:
    name: calendarapp
  piservices-proxy:
    external: true
