services:
  api:
    build:
      context: .
      target: api
    container_name: calendarapp-api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-calendarapp}
      - APP_PASSWORD=${APP_PASSWORD:-familycalendar}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      target: frontend-react
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: calendarapp-frontend
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped
